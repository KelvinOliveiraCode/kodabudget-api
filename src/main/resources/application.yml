spring:
  application:
    name: kodabudget-api
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:local-mode}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.2
      embedding:
        options:
          model: ${OPENAI_CHAT_MODEL:text-embedding-3-small}
  servlet:
    multipart:
      max-file-size: 10MB
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:file:./data/kodabudget;MODE=PostgreSQL
    username: sa
    password: ""
server:
  port: 9091
springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs
kodabudget:
  voice:
    python: python
    stt-model: small
    stt-language: pt
    tts-voice: pt-BR-AntonioNeural
